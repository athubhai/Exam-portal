version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: exam_portal_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: exam_portal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_portal_backend
    environment:
      PROJECT_NAME: "Secure Online Exam Portal API"
      SECRET_KEY: "production-secure-key-change-in-production-use-openssl"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/exam_portal_db"
      ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://127.0.0.1:5173"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_portal_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
